<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
  <title id="t">Same lecture example, old note vs new note</title>
  <desc id="d">Left: a typical AI note stops at the method and writes the Brokaw coefficient as 0.19 instead of 0.196, with no numeric result. Right: the pipeline's note works the example step by step to D = 0.344 cm²/s and passes verify.py.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e3e7e1" stroke-width="1"/>
    </pattern>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <rect width="1280" height="520" fill="#f3f5f2"/>
  <rect width="1280" height="520" fill="url(#grid)"/>

  <text x="136" y="40" class="mono" font-size="13" fill="#5b6b72" letter-spacing="1">CME222 MASS TRANSFER · L03 · SAME 32-SLIDE LECTURE</text>
  <text x="136" y="92" class="serif" font-size="36" font-weight="700" fill="#1f2a30">Same example, old note vs new note</text>
  <text x="136" y="128" class="sans" font-size="17" fill="#5b6b72">Slide example 3: diffusivity of ammonia in air at 373 K (Brokaw method).</text>

  <!-- old note -->
  <rect x="136" y="160" width="496" height="336" rx="8" fill="#ffffff" stroke="#d8ddd6"/>
  <text x="156" y="200" class="serif" font-size="20" fill="#1f2a30">Old note</text>
  <rect x="502" y="184" width="112" height="26" rx="13" fill="#f6dfdb"/>
  <text x="558" y="202" class="sans" font-size="13" fill="#b8412c" text-anchor="middle">stops at idea</text>
  <rect x="156" y="226" width="456" height="216" rx="4" fill="#f1f3f0"/>
  <g class="mono" font-size="14" fill="#1f2a30">
    <text x="172" y="256" font-weight="700" fill="#1f4e8c">### Example 3: NH₃ in air</text>
    <text x="172" y="294">Idea: compute δ_NH₃ → corrected σ, ε/k</text>
    <text x="172" y="318">→ T* → corrected Ω_D → Hirschfelder.</text>
    <text x="172" y="356">Ω_D,polar = Ω_D + <tspan fill="#b8412c" text-decoration="line-through">0.19</tspan> δ_AB² / T*</text>
    <text x="188" y="380" fill="#b8412c">↑ the slide says 0.196</text>
    <text x="172" y="418" fill="#b8412c">(no numeric result)</text>
  </g>

  <!-- new note -->
  <rect x="648" y="160" width="496" height="336" rx="8" fill="#ffffff" stroke="#d8ddd6"/>
  <text x="668" y="200" class="serif" font-size="20" fill="#1f2a30">New note</text>
  <rect x="990" y="184" width="136" height="26" rx="13" fill="#dcefe2"/>
  <text x="1058" y="202" class="mono" font-size="13" fill="#2f7a4c" text-anchor="middle">verify.py passes</text>
  <rect x="668" y="226" width="456" height="252" rx="4" fill="#f1f3f0"/>
  <g class="mono" font-size="14" fill="#1f2a30">
    <text x="684" y="254" font-weight="700" fill="#1f4e8c">Example 4.1: NH₃–air, 373 K (p.27)</text>
    <text x="684" y="280">① δ_NH₃ = 1.94e3×1.46² / (25.8×239.81)</text>
    <text x="740" y="302">= 0.668, air δ = 0 ⇒ δ_AB = 0</text>
    <text x="684" y="328">② σ_AB = √(2.958 × 3.619) = 3.272 Å</text>
    <text x="704" y="350" fill="#b8412c">geometric mean, slide p.26</text>
    <text x="684" y="376">③ T* = 373 / √(447.3×93.0) = 1.829</text>
    <text x="704" y="398">Ω_D = 1.110</text>
    <text x="684" y="424">④ D = 0.001858×373^1.5×(1/17+1/29)^½</text>
    <text x="740" y="446">/ (1 × 3.272² × 1.110)</text>
    <text x="684" y="470" font-weight="700" fill="#2f7a4c">Result: D = 0.344 cm²/s</text>
  </g>
</svg>
